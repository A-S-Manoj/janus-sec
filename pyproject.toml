[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-sec"
version = "0.1.0"
description = "A terminal-first credential exposure auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.58",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.scripts]
janus-sec = "janus_sec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["janus_sec"]